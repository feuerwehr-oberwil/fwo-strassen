# Monthly dependency updates: npm minor + patch in one PR (majors stay separate), and the
# GitHub Actions used in .github/workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

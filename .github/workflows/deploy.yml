# Builds the static site and publishes it to GitHub Pages on every push to main, and once a day:
# a merge made by GitHub auto-merge (Dependabot) uses the workflow token and starts no push run,
# so the daily run takes such a merge live by the next morning.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC daily
  workflow_dispatch:

# The build job only reads the repo; the deploy job below gets the Pages rights.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          # progress backup (server/) on Railway, project fwo-strassen, service backup
          VITE_BACKUP_URL: https://backup-production-81ef.up.railway.app
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # OIDC token that proves the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# Turns on GitHub auto-merge for Dependabot PRs that are npm minor or patch updates, or any
# GitHub Actions update. npm majors wait for a person. GitHub then merges the PR once the required
# checks on main pass. This workflow only asks for auto-merge and never merges by itself: without
# the repo setting «Allow auto-merge», or with no requirement on main that is still open, the
# request fails and nothing merges.
#
# GitHub makes the merge with this workflow's token and starts no workflow run for it, so Deploy
# and Backup image do not run. An auto-merged update goes live with the next push to main, or with
# a manual run of Deploy.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write # both are needed to turn auto-merge on or off
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  PR_ID: ${{ github.event.pull_request.node_id }}

jobs:
  # Dependabot pushed: ask for auto-merge when the update is small.
  automerge-on:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # reads the update from Dependabot's commit; stops when Dependabot did not sign that commit
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >-
          steps.metadata.outputs.package-ecosystem == 'github_actions' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        # the mutation, not `gh pr merge --auto`: gh merges at once when no required check is open
        run: >-
          gh api graphql -f pr="$PR_ID" -f head="$HEAD_SHA" -f query='
          mutation($pr: ID!, $head: GitObjectID!) { enablePullRequestAutoMerge(
          input: { pullRequestId: $pr, expectedHeadOid: $head, mergeMethod: MERGE }
          ) { clientMutationId } }'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # A person pushed to a Dependabot PR (or reopened it): turn auto-merge off, so their commits
  # wait for a person. GitHub keeps auto-merge on after a push by someone with write access.
  # Make `automerge-off` a required check on main, next to CI's `check`: then such a PR cannot
  # merge before this job has run. On every other PR the job is skipped, which counts as passed.
  automerge-off:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: >-
          gh api graphql -f pr="$PR_ID" -f query='mutation($pr: ID!) {
          disablePullRequestAutoMerge(input: { pullRequestId: $pr }) { clientMutationId } }'

# Builds the backup API (server/Dockerfile) and pushes it to GHCR. Railway's `backup` service
# (project fwo-strassen) runs ghcr.io/feuerwehr-oberwil/fwo-strassen-backup:latest – a prebuilt image
# needs none of Railway's build steps. After a new image: `railway redeploy --service backup`.
name: Backup image

on:
  push:
    branches: [main]
    paths: [server/**, package.json, pnpm-lock.yaml, .github/workflows/backup-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/feuerwehr-oberwil/fwo-strassen-backup:latest
            ghcr.io/feuerwehr-oberwil/fwo-strassen-backup:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/feuerwehr-oberwil/fwo-strassen

# Quarterly (and on demand) rebuilds data/ from swisstopo and OpenStreetMap with `pnpm data` and
# opens a PR when anything but the dates changed. The PR body lists removed streets and changed
# house-number ranges, because progress cards keyed on them are dropped (pipeline/townDiff.ts).
name: Data refresh

on:
  schedule:
    - cron: '0 5 2 1,4,7,10 *' # 2 Jan / Apr / Jul / Oct, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write # create-pull-request pushes the data/refresh branch
  pull-requests: write # ... and opens or updates the PR
  actions: write # start CI on the PR branch (see the last step)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp data/town.json "$RUNNER_TEMP/town-before.json"
      - run: pnpm data
      - id: changed
        # dates alone don't make a refresh
        run: |
          if git diff --quiet -I '"(generated|sourceDate)":' -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.changed == 'true'
        run: |
          {
            echo "Quarterly \`pnpm data\` refresh (swisstopo data of $(node -p "require('./data/town.json').sourceDate"))."
            echo
            echo "## What it does to progress"
            echo
            node pipeline/townDiff.ts "$RUNNER_TEMP/town-before.json" data/town.json
            echo
            echo "Check the lists above before merging: a dropped card means a driver relearns that street or section."
            echo
            echo '```'
            git diff --stat -- data
            echo '```'
          } > "$RUNNER_TEMP/body.md"
      - if: steps.changed.outputs.changed == 'true'
        run: pnpm test
      - if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: data/refresh
          commit-message: 'Data: quarterly refresh from swisstopo and OpenStreetMap'
          title: 'Data refresh'
          body-path: ${{ runner.temp }}/body.md
          add-paths: data
      # A PR opened with the workflow token starts no workflow run, so the required checks `check`
      # and `automerge-off` would never report and the PR stays blocked. A manual (dispatch) run
      # is the exception: both report on the branch head.
      - if: steps.changed.outputs.changed == 'true'
        run: |
          gh workflow run ci.yml --ref data/refresh
          gh workflow run dependabot-automerge.yml --ref data/refresh
        env:
          GH_TOKEN: ${{ github.token }}

<!doctype html>
<html lang="%LANG%">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= busts browsers' sticky favicon cache (they kept showing the old Vite icon); bump it when the icons change -->
    <link rel="icon" type="image/png" href="./icons/favicon-64.png?v=2" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%SHORT_NAME%" />
    <!-- lang, titles and the data directory are filled in per town by `strassen-trainer build` and the dev server (cli/site.ts) -->
    <meta name="strassen-data" content="%DATA%" />
    <title>%TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
